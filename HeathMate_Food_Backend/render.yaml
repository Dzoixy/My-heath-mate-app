services:
  - type: web
    name: heathmate-food-api
    runtime: python
    plan: free

    rootDir: HeathMate_Food_Backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: AI_PROVIDER
        value: gemini

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: GEMINI_API_KEY
        sync: false

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: REQUIRE_EMAIL_VERIFIED
        value: "true"

      - key: USDA_API_KEY
        value: DEMO_KEY
